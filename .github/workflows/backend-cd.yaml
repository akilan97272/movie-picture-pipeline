name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'

  workflow_dispatch:

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run lint
        run: pipenv run lint

  test:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run tests
        run: pipenv run test

  build:
    name: Backend Build and Push
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: 266767661712.dkr.ecr.us-east-1.amazonaws.com/backend
      IMAGE_TAG: ${{ github.sha }}

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build --tag "$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Push Docker image
        run: docker push "$ECR_REPOSITORY:$IMAGE_TAG"

  deploy:
    name: Backend Deploy to EKS
    runs-on: ubuntu-latest

    needs:
      - build

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: 266767661712.dkr.ecr.us-east-1.amazonaws.com/backend
      IMAGE_TAG: ${{ github.sha }}
      EKS_CLUSTER_NAME: cluster

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Install Kustomize
        uses: yokawasa/action-setup-kube-tools@v0.14.0
        with:
          setup-tools: |
            kustomize
          kustomize: '5.8.1'

      - name: Verify Kustomize
        run: kustomize version

      - name: Update Kubernetes image
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image backend="$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to EKS
        working-directory: starter/backend/k8s
        run: |
          kustomize build | kubectl apply -f -
